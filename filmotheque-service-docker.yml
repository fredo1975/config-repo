spring:
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/filmdb
    username: admin
    password: admin123
  pool:
    initial-size: 10
    max-size: 20
    max-idle-time: 30m
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: filmotheque-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
